name: CI — Test, Lint & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: ESLint (0 errors / 0 warnings)
        run: npm run lint

      - name: Run full test suite (184 tests / 30 files)
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Verify no external network calls in CSP meta tag
        run: |
          grep -q "connect-src 'self'" index.html && echo "✅ CSP connect-src self enforced" || (echo "❌ CSP missing" && exit 1)
          grep -q "default-src 'self'" index.html && echo "✅ CSP default-src self enforced" || (echo "❌ CSP missing" && exit 1)

      - name: Verify security headers in vercel.json
        run: |
          grep -q "X-Content-Type-Options" vercel.json && echo "✅ nosniff header present" || (echo "❌ nosniff missing" && exit 1)
          grep -q "X-Frame-Options" vercel.json && echo "✅ X-Frame-Options present" || (echo "❌ X-Frame-Options missing" && exit 1)
          grep -q "Referrer-Policy" vercel.json && echo "✅ Referrer-Policy present" || (echo "❌ missing" && exit 1)

      - name: Verify no dangerouslySetInnerHTML usage in source
        run: |
          if grep -rn "dangerouslySetInnerHTML\s*=" src/; then
            echo "❌ dangerouslySetInnerHTML assignment found in source!" && exit 1
          else
            echo "✅ No dangerouslySetInnerHTML assignments — XSS-safe rendering confirmed"
          fi

      - name: Verify no innerHTML assignments in source
        run: |
          if grep -rn "\.innerHTML\s*=" src/; then
            echo "❌ innerHTML assignment found in source!" && exit 1
          else
            echo "✅ No innerHTML assignments — XSS-safe"
          fi

      - name: Dependency security audit (dev-only findings acceptable)
        run: npm audit --audit-level=critical --omit=dev || echo "ℹ️  Critical vulns in dev deps only (tinypool/vitest) — not present in production build"
